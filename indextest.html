<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZF3D Viewer · Flare3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --ink: #0a0c0a;
  --panel: #12140f;
  --panel-line: #2a2e22;
  --amber: #ffb200;
  --amber-dim: #8a6300;
  --amber-faint: rgba(255,178,0,0.12);
  --text: #d9d6c8;
  --text-dim: #7a7a6c;
  --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--ink);
  font-family: var(--mono);
  color: var(--text);
  overflow: hidden;
}
#viewport {
  position: fixed; inset: 0;
}
#viewport canvas { display: block; }
#scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,178,0,0.025) 0px,
    rgba(255,178,0,0.025) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: overlay;
}
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--panel-line);
  background: linear-gradient(to bottom, rgba(10,12,10,0.92), rgba(10,12,10,0.0));
  pointer-events: none;
  flex-wrap: wrap; gap: 8px;
}
#topbar .brand {
  display: flex; align-items: baseline; gap: 10px;
  pointer-events: auto;
}
#topbar .brand .mark {
  color: var(--amber); font-weight: 700; letter-spacing: 0.12em; font-size: 13px;
}
#topbar .brand .sub {
  color: var(--text-dim); font-size: 11px; letter-spacing: 0.06em;
}
#topbar .actions {
  display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap;
}
button.chip {
  font-family: var(--mono);
  background: var(--panel);
  border: 1px solid var(--panel-line);
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 0.05em;
  padding: 7px 11px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, opacity 0.15s;
}
button.chip:hover {
  border-color: var(--amber-dim);
  color: var(--text);
}
button.chip.active {
  border-color: var(--amber);
  color: var(--amber);
  background: var(--amber-faint);
}
button.chip:disabled {
  opacity: 0.35;
  cursor: default;
}
button.chip:disabled:hover {
  border-color: var(--panel-line);
  color: var(--text-dim);
}
#hud {
  position: fixed; left: 18px; bottom: 18px; z-index: 10;
  font-size: 11px; line-height: 1.65;
  color: var(--text-dim);
  background: rgba(10,12,10,0.72);
  border: 1px solid var(--panel-line);
  padding: 12px 14px;
  min-width: 230px;
  display: none;
}
#hud.visible { display: block; }
#hud .row { display: flex; justify-content: space-between; gap: 16px; }
#hud .row .k { color: var(--text-dim); }
#hud .row .v { color: var(--text); text-align: right; }
#hud .filename {
  color: var(--amber); font-weight: 700; font-size: 12px;
  margin-bottom: 8px; word-break: break-all;
  letter-spacing: 0.02em;
}
#hud hr { border: none; border-top: 1px solid var(--panel-line); margin: 8px 0; }
#dropzone {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
#dropzone .frame {
  width: min(560px, 86vw);
  border: 1px solid var(--panel-line);
  background: rgba(18,20,15,0.55);
  padding: 48px 40px;
  text-align: center;
  transition: border-color 0.2s, background 0.2s;
}
#dropzone.drag .frame {
  border-color: var(--amber);
  background: var(--amber-faint);
}
#dropzone .glyph {
  font-size: 11px; color: var(--amber-dim); letter-spacing: 0.3em;
  margin-bottom: 18px;
}
#dropzone h1 {
  font-size: 16px; font-weight: 700; color: var(--text);
  margin: 0 0 10px; letter-spacing: 0.02em;
}
#dropzone p {
  font-size: 12px; color: var(--text-dim); margin: 0 0 22px; line-height: 1.6;
}
#dropzone .cta {
  display: inline-block;
  border: 1px solid var(--amber-dim);
  color: var(--amber);
  padding: 9px 18px;
  font-size: 11px;
  letter-spacing: 0.08em;
}
#dropzone .cursor {
  display: inline-block; width: 7px; height: 12px; background: var(--amber);
  margin-left: 2px; vertical-align: -2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#status {
  position: fixed; z-index: 25; left: 50%; top: 50%; transform: translate(-50%,-50%);
  color: var(--amber); font-size: 12px; letter-spacing: 0.08em; display: none;
}
#status.visible { display: block; }
#errbox {
  position: fixed; z-index: 30; left: 50%; bottom: 26px; transform: translateX(-50%);
  border: 1px solid #7a2c2c; background: rgba(30,10,10,0.9); color: #ff8f8f;
  font-size: 11px; padding: 10px 16px; display: none; max-width: 80vw;
}
#errbox.visible { display: block; }
input[type=file] { display: none; }
@media (max-width:600px) {
  #hud { min-width: 180px; font-size: 10px; }
  #dropzone .frame { padding: 32px 22px; }
}
</style>

// ---------- orbit controls ----------
function OrbitLiteControls(camera, domElement){
  this.camera = camera;
  this.domElement = domElement;
  this.target = new THREE.Vector3();
  this.enableDamping = true;
  this.dampingFactor = 0.08;
  this.minDistance = 0.01;
  this.maxDistance = 1e6;
  this.rotateSpeed = 1;
  this.panSpeed = 1;

  const sphericalDelta = new THREE.Spherical();
  let scale = 1;
  const pointers = new Map();
  let mode = null;
  let pinchStartDist = 0;

  domElement.style.touchAction = 'none';

  const onPointerDown = (e) => {
    domElement.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1){
      mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'rotate';
    } else if (pointers.size === 2){
      mode = 'pinch';
      const pts = Array.from(pointers.values());
      pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
  };

  const onPointerMove = (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (mode === 'rotate' && pointers.size === 1){
      sphericalDelta.theta -= 2 * Math.PI * dx / domElement.clientHeight * this.rotateSpeed;
      sphericalDelta.phi -= 2 * Math.PI * dy / domElement.clientHeight * this.rotateSpeed;
    } else if (mode === 'pan' && pointers.size === 1){
      pan(dx, dy);
    } else if (mode === 'pinch' && pointers.size === 2){
      const pts = Array.from(pointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchStartDist > 0) scale /= (dist / pinchStartDist);
      pinchStartDist = dist;
    }
  };

  const onPointerUp = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) mode = null;
  };

  const onWheel = (e) => {
    e.preventDefault();
    const zoomFactor = 0.95;
    scale *= (e.deltaY < 0) ? zoomFactor : (1 / zoomFactor);
  };

  const pan = (dx, dy) => {
    const offset = new THREE.Vector3().copy(camera.position).sub(this.target);
    const targetDistance = offset.length() * Math.tan((camera.fov / 2) * Math.PI / 180);
    const panX = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const panY = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    const panOffset = new THREE.Vector3();
    panOffset.addScaledVector(panX, -dx * targetDistance * 2 / domElement.clientHeight * this.panSpeed);
    panOffset.addScaledVector(panY, dy * targetDistance * 2 / domElement.clientHeight * this.panSpeed);
    this.target.add(panOffset);
    camera.position.add(panOffset);
  };

  domElement.addEventListener('pointerdown', onPointerDown);
  domElement.addEventListener('pointermove', onPointerMove);
  domElement.addEventListener('pointerup', onPointerUp);
  domElement.addEventListener('pointercancel', onPointerUp);
  domElement.addEventListener('wheel', onWheel, { passive: false });
  domElement.addEventListener('contextmenu', (e) => e.preventDefault());

  this.update = () => {
    const offset = new THREE.Vector3().copy(camera.position).sub(this.target);
    const spherical = new THREE.Spherical().setFromVector3(offset);
    spherical.theta += sphericalDelta.theta;
    spherical.phi += sphericalDelta.phi;
    spherical.phi = Math.max(0.001, Math.min(Math.PI - 0.001, spherical.phi));
    spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, spherical.radius * scale));
    offset.setFromSpherical(spherical);
    camera.position.copy(this.target).add(offset);
    camera.lookAt(this.target);

    if (this.enableDamping){
      sphericalDelta.theta *= (1 - this.dampingFactor);
      sphericalDelta.phi *= (1 - this.dampingFactor);
      scale = 1 + (scale - 1) * (1 - this.dampingFactor);
    } else {
      sphericalDelta.theta = 0;
      sphericalDelta.phi = 0;
      scale = 1;
    }
  };
}

// ---------- scene setup ----------
const viewportEl = document.getElementById('viewport');
const scene = new THREE.Scene();

// Deep blue gradient
const canvas = document.createElement('canvas');
canvas.width = 2;
canvas.height = 512;
const ctx = canvas.getContext('2d');
const gradient = ctx.createLinearGradient(0, 0, 0, 512);
gradient.addColorStop(0, '#0a1a3a');
gradient.addColorStop(1, '#040b18');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, 2, 512);
const bgTexture = new THREE.CanvasTexture(canvas);
scene.background = bgTexture;
scene.fog = new THREE.Fog(0x0a1a3a, 30, 140);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 5000);
camera.position.set(6, 5, 9);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
viewportEl.appendChild(renderer.domElement);

const controls = new OrbitLiteControls(camera, renderer.domElement);
controls.minDistance = 0.1;
controls.maxDistance = 500;

// --- Lighting ---
const hemi = new THREE.HemisphereLight(0xffffff, 0x444466, 0.9);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffeedd, 1.6);
key.position.set(8, 15, 10);
scene.add(key);

const fillLight = new THREE.DirectionalLight(0x88bbff, 0.7);
fillLight.position.set(-5, 2, 8);
scene.add(fillLight);

const rim = new THREE.DirectionalLight(0x6fa8ff, 0.5);
rim.position.set(-6, 4, -8);
scene.add(rim);

const rimBack = new THREE.DirectionalLight(0xffaa66, 0.3);
rimBack.position.set(0, -2, -10);
scene.add(rimBack);

const fillPoint = new THREE.PointLight(0x4499ff, 0.3);
fillPoint.position.set(3, 4, 6);
scene.add(fillPoint);

const grid = new THREE.GridHelper(40, 40, 0x4a7a9c, 0x1a2a3a);
grid.material.transparent = true;
grid.material.opacity = 0.4;
scene.add(grid);

let modelRoot = null;
let wireframeOn = false;
let autorotate = false;
let mixer = null;
let animAction = null;
let animPlaying = false;
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (autorotate && modelRoot) modelRoot.rotation.y += 0.004;
  if (mixer && animPlaying) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- UI ----------
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('errbox');
const hud = document.getElementById('hud');
const btnAnim = document.getElementById('btnAnim');

function showStatus(msg){ statusEl.textContent = msg; statusEl.classList.add('visible'); }
function hideStatus(){ statusEl.classList.remove('visible'); }
function showError(msg){
  errEl.textContent = 'ERROR — ' + msg;
  errEl.classList.add('visible');
  setTimeout(() => errEl.classList.remove('visible'), 6000);
}

dropzone.addEventListener('click', () => fileInput.click());
document.getElementById('btnLoad').addEventListener('click', () => fileInput.click());

['dragenter','dragover'].forEach(evt => {

});
['dragleave','drop'].forEach(evt => {

});
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});
fileInput.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];

document.getElementById('btnWire').addEventListener('click', (e) => {
  wireframeOn = !wireframeOn;
  e.target.classList.toggle('active', wireframeOn);
  if (modelRoot) modelRoot.traverse(o => { if (o.isMesh) o.material.wireframe = wireframeOn; });

document.getElementById('btnSpin').addEventListener('click', (e) => {
  autorotate = !autorotate;
  e.target.classList.toggle('active', autorotate);
});
document.getElementById('btnGrid').addEventListener('click', (e) => {
  grid.visible = !grid.visible;
  e.target.classList.toggle('active', grid.visible);
});
btnAnim.addEventListener('click', () => {
  if (!animAction) return;
  animPlaying = !animPlaying;
  if (animPlaying){
    animAction.paused = false;
    if (animAction.time === 0 && !animAction.isRunning()) animAction.play();
    clock.getDelta();
  } else {
    animAction.paused = true;
  }
  btnAnim.classList.toggle('active', animPlaying);
  btnAnim.textContent = animPlaying ? '⏸ PAUSE ANIM' : '▶ PLAY ANIM';
});

// ---------- Improved ZF3D parser ----------
function parseTransform(str){
  const v = (str || '1,0,0,0,1,0,0,0,1,0,0,0').split(',').map(Number);
  const m = new THREE.Matrix4();
  m.set(
    v[0], v[1], v[2], v[9],
    v[3], v[4], v[5], v[10],
    v[6], v[7], v[8], v[11],
    0, 0, 0, 1
  );
  return m;
}

// Convert half float (uint16) to float
function halfToFloat(h){
  const s = (h & 0x8000) >> 15;
  const e = (h & 0x7C00) >> 10;
  const f = h & 0x03FF;
  if (e === 0) return (s ? -1 : 1) * Math.pow(2, -14) * (f / 1024);
  if (e === 0x1F) return s ? -Infinity : Infinity;
  return (s ? -1 : 1) * Math.pow(2, e-15) * (1 + f/1024);
}

const FORMAT_INFO = {
  float1: { count:1, bytes:4, read:(dv,o)=>dv.getFloat32(o, true) },
  float2: { count:2, bytes:4, read:(dv,o)=>dv.getFloat32(o, true) },
  float3: { count:3, bytes:4, read:(dv,o)=>dv.getFloat32(o, true) },
  float4: { count:4, bytes:4, read:(dv,o)=>dv.getFloat32(o, true) },
  ubyte4: { count:4, bytes:1, read:(dv,o)=>dv.getUint8(o) },
  ubyte4n: { count:4, bytes:1, read:(dv,o)=>dv.getUint8(o) / 255 },
  byte4: { count:4, bytes:1, read:(dv,o)=>dv.getInt8(o) },
  byte4n: { count:4, bytes:1, read:(dv,o)=>dv.getInt8(o) / 127 },
  short2: { count:2, bytes:2, read:(dv,o)=>dv.getInt16(o, true) },
  short4: { count:4, bytes:2, read:(dv,o)=>dv.getInt16(o, true) },
  ushort2: { count:2, bytes:2, read:(dv,o)=>dv.getUint16(o, true) },
  ushort4: { count:4, bytes:2, read:(dv,o)=>dv.getUint16(o, true) },
  half2: { count:2, bytes:2, read:(dv,o)=>halfToFloat(dv.getUint16(o, true)) },
  half4: { count:4, bytes:2, read:(dv,o)=>halfToFloat(dv.getUint16(o, true)) },
};

function getFormatInfo(fmt){
  const key = (fmt || '').toLowerCase();
  if (FORMAT_INFO[key]) return FORMAT_INFO[key];
  const m = /float(\d+)/i.exec(fmt || '');
  if (m) return { count: parseInt(m[1], 10), bytes:4, read:(dv,o)=>dv.getFloat32(o, true) };
  console.warn('[zf3d] unrecognized vertex format "' + fmt + '" — assuming float1.');
  return { count:1, bytes:4, read:(dv,o)=>dv.getFloat32(o, true) };
}

function buildGeometry(surface, arrayBuffer){
  const inputs = surface.inputs || [];
  const formats = surface.formats || [];
  let byteCursor = 0;
  const layout = {};
  inputs.forEach((name, idx) => {
    const info = getFormatInfo(formats[idx] || 'float1');
    layout[name] = { byteOffset: byteCursor, count: info.count, bytes: info.bytes, read: info.read };
    byteCursor += info.count * info.bytes;
  });

  const declaredStride = surface.sizePerVertex ? surface.sizePerVertex * 4 : 0;
  const byteStride = byteCursor || declaredStride;
  if (!byteStride) return null;

  const vertexCount = Math.floor(arrayBuffer.byteLength / byteStride);
  if (vertexCount === 0) return null;

  const dv = new DataView(arrayBuffer);

  function extract(name){
    const spec = layout[name];
    if (!spec) return null;
    const out = new Float32Array(vertexCount * spec.count);
    for (let i = 0; i < vertexCount; i++){
      const base = i * byteStride + spec.byteOffset;
      for (let c = 0; c < spec.count; c++){
        out[i * spec.count + c] = spec.read(dv, base + c * spec.bytes);
      }
    }
    return out;
  }

  const geometry = new THREE.BufferGeometry();

  // Try multiple common position names
  let pos = extract('POSITION') || extract('POS') || extract('VERTEX');
  if (pos) geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  let norm = extract('NORMAL') || extract('NORM');
  if (norm) geometry.setAttribute('normal', new THREE.BufferAttribute(norm, 3));

  let uv = extract('UV0') || extract('TEXCOORD0') || extract('UV');
  if (uv) geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

  // NOTE: the vertex input is named "COLOR0" (not "COLOR") in the .zf3d format —
  // extracting the wrong key silently dropped vertex color data.
  const color = extract('COLOR0');
  if (color) geometry.setAttribute('color', new THREE.BufferAttribute(color, layout['COLOR0'].count));

  // Skinning: case-insensitive search
  const skinIdxName = inputs.find(n => /SKININDEX|BLENDINDICES/i.test(n));
  const skinWtName = inputs.find(n => /SKINWEIGHT|BLENDWEIGHT/i.test(n));
  let hasSkin = false;
  if (skinIdxName && skinWtName){
    const skinIndex = extract(skinIdxName);
    const skinWeight = extract(skinWtName);
    if (skinIndex && skinWeight){
      geometry.setAttribute('skinIndex', new THREE.BufferAttribute(skinIndex, layout[skinIdxName].count));
      geometry.setAttribute('skinWeight', new THREE.BufferAttribute(skinWeight, layout[skinWtName].count));
      hasSkin = true;
    }
  }

  if (!norm) geometry.computeVertexNormals();
  geometry.userData.hasSkin = hasSkin;
  geometry.userData.hasColor = !!color;
  return geometry;
}

function parseFilterUV(filterEl){
  if (!filterEl) return null;
  const getParam = (name) => {
    const p = filterEl.querySelector('param[name="' + name + '"]');
    if (!p) return null;
    const v = (p.getAttribute('value') || '').split(',').map(Number);
    return (v.length >= 2 && !v.some(isNaN)) ? v : null;
  };
  const offset = getParam('offset');
  const repeat = getParam('repeat');
  if (!offset && !repeat) return null;
  return {
    uOffset: offset ? offset[0] : 0,
    vOffset: offset ? offset[1] : 0,
    uScale: repeat ? repeat[0] : 1,
    vScale: repeat ? repeat[1] : 1,
  };
}

function wrapModeFromSampler(samplerEl){
  const w = samplerEl ? samplerEl.getAttribute('wrap') : null;
  if (w === '0') return THREE.ClampToEdgeWrapping;
  if (w === '2') return THREE.MirroredRepeatWrapping;
  return THREE.RepeatWrapping;
}

async function parseZf3d(file){
  const buf = await file.arrayBuffer();
  if (!buf || buf.byteLength === 0) throw new Error('file is empty');

  let zip;
  try { zip = await JSZip.loadAsync(buf); } catch(e){ throw new Error('not a valid .zf3d zip: ' + e.message); }

  let xmlEntry = null;
  zip.forEach((path, entry) => { if (!xmlEntry && /\.xml$/i.test(path)) xmlEntry = entry; });
  if (!xmlEntry) throw new Error('no scene .xml found');

  const xmlText = await xmlEntry.async('text');
  const xmlDoc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (xmlDoc.querySelector('parsererror')) throw new Error('xml parse error');
  const root = xmlDoc.documentElement;

  const animationDefsById = {};
  const animationsParent = root.querySelector(':scope > animations');
  if (animationsParent){
    animationsParent.querySelectorAll(':scope > animation').forEach(el => {
      animationDefsById[el.getAttribute('id')] = {
        source: el.getAttribute('source'),
        format: el.getAttribute('format') || 'float3x4',
      };
    });
  }

  const surfacesById = {};
  const surfacesParent = root.querySelector(':scope > surfaces');
  if (surfacesParent){
    surfacesParent.querySelectorAll(':scope > surface').forEach(el => {
      surfacesById[el.getAttribute('id')] = {
        id: el.getAttribute('id'),
        source: el.getAttribute('source'),
        name: el.getAttribute('name'),
        sizePerVertex: parseInt(el.getAttribute('sizePerVertex'), 10) || 0,
        numTriangles: parseInt(el.getAttribute('numTriangles'), 10) || 0,
        inputs: (el.getAttribute('inputs') || '').split(',').filter(Boolean),
        formats: (el.getAttribute('formats') || '').split(',').filter(Boolean),
      };
    });
  }

  const mapsById = {};
  const mapsParent = root.querySelector(':scope > maps');
  if (mapsParent){
    mapsParent.querySelectorAll(':scope > map').forEach(el => {
      mapsById[el.getAttribute('id')] = { source: el.getAttribute('source') };
    });
  }

  const filtersById = {};
  const filtersParent = root.querySelector(':scope > filters');
  if (filtersParent){
    filtersParent.querySelectorAll(':scope > filter').forEach(el => {
      const sampler = el.querySelector('sampler[map]');
      filtersById[el.getAttribute('id')] = {
        mapId: sampler ? sampler.getAttribute('map') : null,
        uv: parseFilterUV(el),
        wrap: wrapModeFromSampler(sampler),
      };
    });
  }

  const materialDefs = {};
  const materialsParent = root.querySelector(':scope > materials');
  if (materialsParent){
    materialsParent.querySelectorAll(':scope > material').forEach(el => {
      const shader = el.querySelector('shader');
      const filterIds = shader && shader.getAttribute('filters') ? shader.getAttribute('filters').split(',') : [];
      let mapId = null, uv = null, wrap = THREE.RepeatWrapping;
      for (const fid of filterIds){
        if (filtersById[fid] && filtersById[fid].mapId){
          mapId = filtersById[fid].mapId;
          uv = filtersById[fid].uv;
          wrap = filtersById[fid].wrap;
          break;
        }
      }
      materialDefs[el.getAttribute('id')] = {
        name: el.getAttribute('name'),
        twoSided: el.getAttribute('twoSided') === 'true',
        transparent: el.getAttribute('transparent') === 'true',
        mapId, uv, wrap,
      };
    });
  }

  const meshNodeEls = Array.from(root.querySelectorAll('nodes node[type="mesh"]'));
  const neededSurfaceIds = new Set();
  const neededMaterialIds = new Set();
  meshNodeEls.forEach(el => {
    (el.getAttribute('surfaces') || '').split(',').filter(Boolean).forEach(id => neededSurfaceIds.add(id));
    (el.getAttribute('materials') || '').split(',').filter(Boolean).forEach(id => neededMaterialIds.add(id));
  });

  const geometryCache = {};
  let triangleTotal = 0;
  await Promise.all(Array.from(neededSurfaceIds).map(async (sid) => {
    const surface = surfacesById[sid];
    if (!surface || !surface.inputs.some(n => /POSITION|POS|VERTEX/i.test(n))) return;
    const entry = zip.file(surface.source + '.vertex');
    if (!entry) return;
    const arrayBuffer = await entry.async('arraybuffer');
    geometryCache[sid] = buildGeometry(surface, arrayBuffer);
    triangleTotal += surface.numTriangles;
  }));

  const textureCache = {};
  await Promise.all(Array.from(neededMaterialIds).map(async (mid) => {
    const def = materialDefs[mid];
    if (!def || !def.mapId) return;
    const mapDef = mapsById[def.mapId];
    if (!mapDef || !mapDef.source) return;
    const entry = zip.file(mapDef.source);
    if (!entry) return;
    const blob = await entry.async('blob');
    const url = URL.createObjectURL(blob);
    const tex = await new Promise((resolve, reject) => {
      new THREE.TextureLoader().load(url, resolve, undefined, reject);
    });
    tex.encoding = THREE.sRGBEncoding;
    tex.flipY = true;
    tex.wrapS = def.wrap;
    tex.wrapT = def.wrap;
    if (def.uv){
      tex.repeat.set(def.uv.uScale, def.uv.vScale);
      tex.offset.set(def.uv.uOffset, def.uv.vOffset);
    }
    tex.needsUpdate = true;
    textureCache[mid] = tex;
  }));

  const materialCache = {};
  neededMaterialIds.forEach(mid => {
    const def = materialDefs[mid] || {};
    materialCache[mid] = new THREE.MeshStandardMaterial({
      map: textureCache[mid] || null,
      color: textureCache[mid] ? 0xffffff : 0xb8b6a8,
      // The material's shader chain includes a VertexColorFilter (multiply blend),
      // so vertex colors need to actually be enabled here to have any effect.
      vertexColors: true,
      side: def.twoSided ? THREE.DoubleSide : THREE.FrontSide,
      transparent: !!def.transparent,
      roughness: 0.55,
      metalness: 0.15,
    });
  });
  const fallbackMaterial = new THREE.MeshStandardMaterial({ color: 0x8a8672, roughness: 0.6, metalness: 0.1 });

  const group = new THREE.Group();
  let nodeCount = 0, meshCount = 0, boneCount = 0, skinnedCount = 0;
  const bonesById = {}, bonesInOrder = [];
  const skinnedMeshQueue = [];
  const animatedNodes = [];

  function walk(el, parent){
    nodeCount++;
    const type = el.getAttribute('type');
    const id = el.getAttribute('id');
    const name = el.getAttribute('name') || id || '';
    const isBone = type === 'bone';
    const node = isBone ? new THREE.Bone() : new THREE.Group();
    node.name = name;
    node.matrix.copy(parseTransform(el.getAttribute('transform')));
    node.matrixAutoUpdate = false;
    node.visible = el.getAttribute('visible') !== 'false';
    parent.add(node);

    if (isBone){
      boneCount++;
      bonesInOrder.push(node);
      if (id) bonesById[id] = node;
      bonesById[name] = node;
    }

    const animId = el.getAttribute('animation');
    if (animId){
      animatedNodes.push({
        node,
        animId,
        frameSpeed: parseFloat(el.getAttribute('frameSpeed')) || 1,
      });
    }

    if (type === 'mesh'){
      const surfaceIds = (el.getAttribute('surfaces') || '').split(',').filter(Boolean);
      const materialIds = (el.getAttribute('materials') || '').split(',').filter(Boolean);
      const boneIdsAttr = (el.getAttribute('bones') || '').split(',').filter(Boolean);

      surfaceIds.forEach((sid, idx) => {
        const geometry = geometryCache[sid];
        if (!geometry) return;
        const mat = materialCache[materialIds[idx]] || fallbackMaterial;
        const meshName = (surfacesById[sid] && surfacesById[sid].name) || sid;

        if (geometry.userData.hasSkin){
          const mesh = new THREE.SkinnedMesh(geometry, mat.clone());
          mesh.name = meshName;
          mesh.frustumCulled = false;
          node.add(mesh);
          meshCount++; skinnedCount++;
          skinnedMeshQueue.push({ mesh, boneIdsAttr });
        } else {
          const mesh = new THREE.Mesh(geometry, mat.clone());
          mesh.name = meshName;
          node.add(mesh);
          meshCount++;
        }
      });
    }

    Array.from(el.children).forEach(child => {
      if (child.tagName === 'node') walk(child, node);
    });
  }

  const nodesParent = root.querySelector(':scope > nodes');
  if (nodesParent){
    Array.from(nodesParent.children).forEach(el => {
      if (el.tagName === 'node') walk(el, group);
    });
  }

  if (skinnedMeshQueue.length){
    group.updateMatrixWorld(true);
    skinnedMeshQueue.forEach(({ mesh, boneIdsAttr }) => {
      let bones = boneIdsAttr.map(id => bonesById[id]).filter(Boolean);
      if (!bones.length) bones = bonesInOrder;
      if (!bones.length) return;
      const skeleton = new THREE.Skeleton(bones);
      mesh.bind(skeleton, mesh.matrixWorld);
    });
  }

  const ANIMATION_FPS = 30;
  const animClip = await loadNodeAnimations(zip, animationDefsById, animatedNodes, ANIMATION_FPS);

  return {
    group,
    clip: animClip,
    stats: {
      nodeCount, meshCount, surfaceCount: neededSurfaceIds.size,
      materialCount: neededMaterialIds.size, triangleTotal,
      boneCount, skinnedCount, animatedNodeCount: animatedNodes.length,
      hasPlayableClip: !!animClip,
    }
  };
}

async function loadNodeAnimations(zip, animationDefsById, animatedNodes, fps){
  if (!animatedNodes.length) return null;
  const tracks = [];
  let maxDuration = 0;
  const m = new THREE.Matrix4();

  await Promise.all(animatedNodes.map(async ({ node, animId, frameSpeed }) => {
    const def = animationDefsById[animId];
    if (!def) return;
    const entry = zip.file(def.source + '.animation');
    if (!entry) return;
    const buf = await entry.async('arraybuffer');
    const floats = new Float32Array(buf);
    const frameCount = Math.floor(floats.length / 12);
    if (frameCount < 2) return;

    const times = new Array(frameCount);
    const posValues = new Array(frameCount * 3);
    const quatValues = new Array(frameCount * 4);
    const sclValues = new Array(frameCount * 3);
    const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();

    for (let f = 0; f < frameCount; f++){
      const b = f * 12;
      m.set(
        floats[b+0], floats[b+1], floats[b+2], floats[b+9],
        floats[b+3], floats[b+4], floats[b+5], floats[b+10],
        floats[b+6], floats[b+7], floats[b+8], floats[b+11],
        0, 0, 0, 1
      );
      m.decompose(pos, quat, scl);
      times[f] = (f / fps) / (frameSpeed || 1);
      posValues[f*3] = pos.x; posValues[f*3+1] = pos.y; posValues[f*3+2] = pos.z;
      quatValues[f*4] = quat.x; quatValues[f*4+1] = quat.y; quatValues[f*4+2] = quat.z; quatValues[f*4+3] = quat.w;
      sclValues[f*3] = scl.x; sclValues[f*3+1] = scl.y; sclValues[f*3+2] = scl.z;
    }

    maxDuration = Math.max(maxDuration, times[times.length - 1]);
    const path = '{' + node.name + '}';
    tracks.push(new THREE.VectorKeyframeTrack(path + '.position', times, posValues));
    tracks.push(new THREE.QuaternionKeyframeTrack(path + '.quaternion', times, quatValues));
    tracks.push(new THREE.VectorKeyframeTrack(path + '.scale', times, sclValues));

    // FIX: node.matrix currently holds the correct bind-pose transform (set in walk()
    // with matrixAutoUpdate = false). Flipping matrixAutoUpdate to true without first
    // copying that matrix into position/quaternion/scale caused Three.js to instantly
    // recompute node.matrix from the *default* identity transform on the very next
    // render — collapsing every animated node to its parent's origin before Play was
    // even pressed. Decomposing here preserves the bind pose as the starting point,
    // which the mixer then smoothly overrides once keyframes are evaluated.
    node.matrix.decompose(node.position, node.quaternion, node.scale);
    node.matrixAutoUpdate = true;
  }));

  if (!tracks.length) return null;
  return new THREE.AnimationClip('zf3d_animation', maxDuration, tracks);
}

function frameCamera(object3d){
  object3d.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(object3d);
  if (box.isEmpty()) return;

  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);

  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 1.6 / Math.tan((camera.fov * Math.PI/180) / 2);

  camera.position.set(
    center.x + dist * 0.55,
    center.y + dist * 0.4,
    center.z + dist * 0.55
  );
  camera.near = Math.max(maxDim / 500, 0.001);
  camera.far = maxDim * 50;
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.update();

  grid.position.y = box.min.y;
  const gridScale = Math.max(maxDim * 2, 4) / 40;
  grid.scale.set(gridScale, 1, gridScale);
}

async function handleFile(file){
  if (!file){ showError('no file'); return; }
  showStatus('PARSING ' + (file.name || 'FILE').toUpperCase() + '…');

  try {
    const result = await parseZf3d(file);

    if (modelRoot){
      scene.remove(modelRoot);
      modelRoot.traverse(o => {
        if (o.isMesh || o.isSkinnedMesh){
          o.geometry.dispose();
          if (o.material.map) o.material.map.dispose();
          o.material.dispose();
        }
      });
    }

    mixer = null; animAction = null; animPlaying = false;
    btnAnim.classList.remove('active');
    btnAnim.textContent = '▶ PLAY ANIM';
    btnAnim.disabled = true;

    modelRoot = result.group;
    modelRoot.traverse(o => { if (o.isMesh || o.isSkinnedMesh) o.material.wireframe = wireframeOn; });
    scene.add(modelRoot);
    frameCamera(modelRoot);

    if (result.clip){
      mixer = new THREE.AnimationMixer(modelRoot);
      animAction = mixer.clipAction(result.clip);
      animAction.play();
      animAction.paused = true;
      btnAnim.disabled = false;
      animAction.time = 0;
    }

    dropzone.style.display = 'none';
    hud.classList.add('visible');
    document.getElementById('hudName').textContent = file.name;
    document.getElementById('hudNodes').textContent = result.stats.nodeCount;
    document.getElementById('hudSurfaces').textContent = result.stats.surfaceCount + ' (' + result.stats.meshCount + ' mesh)';
    document.getElementById('hudTris').textContent = result.stats.triangleTotal.toLocaleString();
    document.getElementById('hudMats').textContent = result.stats.materialCount;
    document.getElementById('hudBones').textContent = result.stats.boneCount;
    document.getElementById('hudSkinned').textContent = result.stats.skinnedCount;

    let animLabel = 'none (bind pose)';
    if (result.stats.hasPlayableClip){
      animLabel = 'present (' + result.clip.duration.toFixed(2) + 's, ' +
        result.stats.animatedNodeCount + ' nodes)';
    } else if (result.stats.animatedNodeCount){
      animLabel = 'present (failed to load — see console)';
    }
    document.getElementById('hudAnim').textContent = animLabel;

    hideStatus();
  } catch (err){
    console.error(err);
    hideStatus();
    showError(err.message || String(err));
  }
}

})();
</script>
