<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZF3D Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- UI Controls Panel -->
    <div class="ui-panel">
      <h3>ZF3D Viewer</h3>
      <div class="ui-row"><span>Status:</span> <span id="status">Idle</span></div>
      <div class="ui-row"><span>Vertices:</span> <span id="vertexCount">0</span></div>
      <div class="ui-row"><span>Faces:</span> <span id="faceCount">0</span></div>
      <div class="ui-row"><span>Bones:</span> <span id="boneCount">0</span></div>
      
      <div class="ui-row" style="margin-top: 10px;">
        <label><input type="checkbox" id="wireframeToggle"> Wireframe</label>
        <label><input type="checkbox" id="autoRotateToggle"> Auto Rotate</label>
      </div>
      
      <button class="ui-button" id="resetCamBtn">Reset Camera</button>
      <input type="file" id="fileInput" style="display: none;" accept=".zip">
      <button class="ui-button" style="background: #27272a;" onclick="document.getElementById('fileInput').click()">Open Archive</button>
    </div>

    <!-- 3D Viewport -->
    <div id="viewport">
      <div id="dropZone">
        <p style="color: #9ca3af; font-size: 12px;">Drop .zip container here</p>
      </div>
    </div>
  </div>

  <!-- Three.js & JSZip Import Maps / Scripts -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
