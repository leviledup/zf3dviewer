<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZF3D Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="viewport"></div>

  <div class="content-container">
    <div class="ui-panel">
      <h2>ZF3D Viewer</h2>
      <div class="ui-row"><span>Status:</span> <span id="status">Idle</span></div>
      <div class="ui-row"><span>Vertices:</span> <span id="vertexCount">0</span></div>
      <div class="ui-row"><span>Faces:</span> <span id="faceCount">0</span></div>
      <div class="ui-row"><span>Bones:</span> <span id="boneCount">0</span></div>
      
      <div class="ui-toggles">
        <label><input type="checkbox" id="wireframeToggle"> Wireframe</label>
        <label><input type="checkbox" id="autoRotateToggle"> Auto Rotate</label>
      </div>

      <button id="resetCamBtn" class="ui-btn">Reset Camera</button>
    </div>

    <div id="dropZone" class="drop-zone">
      <p>Drag & drop a <strong>.zf3d</strong> or raw binary files here</p>
      <span>or</span>
      <input type="file" id="fileInput" accept=".zip,.zf3d" style="display: none;">
      <button class="ui-btn" onclick="document.getElementById('fileInput').click()">Browse Files</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
